<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ER Relations Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: fixed left rail (role + nav) beside a single working column; right-side drawer for forms. Collapses to a top bar on phones. */
:root{
  --bg:#f4f6f3;--surface:#ffffff;--surface-2:#edf1ec;--line:#dbe1da;--line-2:#c9d1c8;
  --fg:#17211c;--muted:#5d6a63;--faint:#8a958f;
  --accent:#1f5f4a;--accent-ink:#ffffff;--accent-soft:#e1eee7;
  --ok:#2c7a4c;--ok-soft:#e2f2e8;--warn:#a86500;--warn-soft:#fbefd9;--risk:#b2362a;--risk-soft:#f9e3df;--info:#2c5a88;--info-soft:#e2ebf5;
  --ai:#6248ad;--ai-soft:#eee9fa;
  --shadow:0 12px 40px rgba(20,35,28,.14);
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614;--surface:#18201c;--surface-2:#202a25;--line:#2b3631;--line-2:#3a4741;
  --fg:#e5ece8;--muted:#9aa7a0;--faint:#6f7c75;
  --accent:#62b996;--accent-ink:#0d1a14;--accent-soft:#1d3a2e;
  --ok:#5fc48c;--ok-soft:#183626;--warn:#e3a640;--warn-soft:#3a2c12;--risk:#ef7d6f;--risk-soft:#3d1f1b;--info:#82b2e2;--info-soft:#1b2c3e;
  --ai:#b8a0f4;--ai-soft:#29223f;--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614;--surface:#18201c;--surface-2:#202a25;--line:#2b3631;--line-2:#3a4741;
  --fg:#e5ece8;--muted:#9aa7a0;--faint:#6f7c75;
  --accent:#62b996;--accent-ink:#0d1a14;--accent-soft:#1d3a2e;
  --ok:#5fc48c;--ok-soft:#183626;--warn:#e3a640;--warn-soft:#3a2c12;--risk:#ef7d6f;--risk-soft:#3d1f1b;--info:#82b2e2;--info-soft:#1b2c3e;
  --ai:#b8a0f4;--ai-soft:#29223f;--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:16px}h3{font-size:14px}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* Rail */
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px}
.brand b{font-family:var(--f-display);font-size:15px;display:block}
.brand span{font-size:11px;color:var(--muted)}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .count{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--risk-soft);color:var(--risk);padding:1px 6px;border-radius:9px}
.ico{width:16px;height:16px;flex:none}
.role{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.role select{width:100%}
.proto{font-size:11.5px;color:var(--muted);border:1px dashed var(--line-2);border-radius:6px;padding:8px 10px;line-height:1.4}
.proto b{color:var(--fg)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:500;font-size:12px}
.linkbtn:focus-visible{outline:2px solid var(--accent)}
/* Main */
.main{min-width:0;padding-block:22px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:4px 0 0;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ai{border-color:var(--ai);color:var(--ai);background:var(--ai-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--risk);border-color:var(--risk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=text],input[type=date],input[type=search],textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-risk{background:var(--risk-soft);color:var(--risk)}.p-info{background:var(--info-soft);color:var(--info)}.p-mute{background:var(--surface-2);color:var(--muted)}.p-ai{background:var(--ai-soft);color:var(--ai)}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.risk b{color:var(--risk)}.kpi.warn b{color:var(--warn)}
/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.names{display:flex;flex-wrap:wrap;gap:4px}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.drawer-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:500;font-size:13px}
.chip button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.chip button:hover{background:var(--accent);color:var(--accent-ink)}
.outcome{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px}
.outcome i{border-radius:2px}
.outcome .field>span small{font-weight:400;color:var(--faint)}
/* Pulse */
.pulse-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pulse-row:last-of-type{border-bottom:0}
.pulse-row b{font-weight:600;font-size:13.5px}
.pulse-row small{display:block;color:var(--faint);font-size:11.5px}
.rate{display:flex;gap:4px}
.rate button{all:unset;cursor:pointer;width:30px;height:28px;border-radius:5px;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.rate button.no{width:36px;font-size:11px}
.rate button:hover{border-color:var(--accent);color:var(--fg)}
.rate button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate button.no[aria-pressed="true"]{background:var(--surface-2);border-color:var(--line-2);color:var(--fg)}
.rate button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.avg{display:flex;align-items:baseline;gap:8px}
.avg b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.scale-key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--faint)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:8px 10px}
/* AI */
.ai-box{border:1px solid var(--ai);border-radius:var(--r);background:var(--ai-soft);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ai-h{display:flex;align-items:center;gap:8px;color:var(--ai);font-weight:600;font-size:13px}
.ai-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--surface);border-radius:6px;padding:8px 10px}
.ai-item p{margin:0}
.ai-item small{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.ai-item.done{opacity:.6}
.ref{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;color:var(--ai);border-bottom:1px dotted var(--ai)}
.ref:focus-visible{outline:2px solid var(--ai)}
.ins{display:flex;flex-direction:column;gap:8px}
.ins li{margin:0}
.ins ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.ins-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
/* Timeline */
.tl{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.tl-item:last-child{border-bottom:0}
.tl-date{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.obs{display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 10px;font-size:13.5px;margin-top:8px}
.obs dt{font-size:11.5px;font-weight:600;padding-top:1px}
.obs dd{margin:0}
.c-pos{color:var(--ok)}.c-risk{color:var(--warn)}.c-neg{color:var(--risk)}.c-rec{color:var(--info)}.c-fu{color:var(--muted)}
.b-pos{background:var(--ok)}.b-risk{background:var(--warn)}.b-neg{background:var(--risk)}.b-rec{background:var(--info)}.b-fu{background:var(--line-2)}
.quote{border-left:3px solid var(--line-2);padding:4px 0 4px 10px;color:var(--fg);white-space:pre-wrap}
/* Bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px}
.bar-t{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex}
.bar-t i{display:block;height:100%}
.bar .mono{text-align:right}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* Chart */
.chart svg{width:100%;height:auto;display:block}
.trend-tbl td{padding:7px 10px;font-size:13px}
/* Recorder */
.rec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2)}
.rec-btn{all:unset;cursor:pointer;width:68px;height:68px;border-radius:50%;background:var(--risk);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px var(--risk-soft)}
.rec-btn.on{animation:pulse 1.2s infinite}
.rec-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@keyframes pulse{50%{box-shadow:0 0 0 12px var(--risk-soft)}}
@media (prefers-reduced-motion:reduce){.rec-btn.on{animation:none}}
.timer{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
audio{width:100%;max-width:420px}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:7px;z-index:60;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
/* Employee finder */
.eh{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}
.finder{position:sticky;top:16px;display:flex;flex-direction:column;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:hidden}
.fd-controls{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.fd-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fd-check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.fd-check input{accent-color:var(--accent);width:15px;height:15px}
.fd-count{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint)}
.fd-list{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1;min-height:120px}
.fd-grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;padding:10px 8px 4px;position:sticky;top:-6px;background:var(--surface)}
.fd-item{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n s" "m s";gap:1px 8px;padding:7px 8px;border-radius:6px}
.fd-item:hover{background:var(--surface-2)}
.fd-item[aria-current="true"]{background:var(--accent-soft)}
.fd-item[aria-current="true"] .fd-name{color:var(--accent)}
.fd-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fd-name{grid-area:n;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd-meta{grid-area:m;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd-side{grid-area:s;display:flex;flex-direction:column;align-items:flex-end;gap:3px;color:var(--faint)}
.fd-n{font-family:var(--f-mono);font-size:10.5px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px}
@media (max-width:1000px){.eh{grid-template-columns:minmax(0,1fr)}.finder{position:static;max-height:none}.fd-list{max-height:300px}}
.filters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end}
.inline-close{display:flex;gap:6px;margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.filters{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap}
  .role{margin-top:0}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.ins-grid{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3,.form-grid{grid-template-columns:minmax(0,1fr)}
  .pulse-row{grid-template-columns:minmax(0,1fr)}
  .tl-item{grid-template-columns:minmax(0,1fr);gap:4px}
  .obs{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:84px minmax(0,1fr) 24px}
  .drawer-b{padding-left:14px;padding-right:max(14px,env(safe-area-inset-right,0px))}
}
</style>

<div id="app"></div>

<script>
(function(){

var IND=[
 ["c","Communication Skills","Clarity, organised thoughts, getting ideas across"],
 ["a","Attitude & Professionalism","Conduct, respect, openness to feedback"],
 ["d","Development Readiness","Willingness to learn and improve"],

function pulseChart(pm){
 var W=640,H=220,L=34,R=16,T=14,B=34,n=pm.length;

 var ap=pm.map(function(m,i){return [x(i),y(avgPulse(m.pulse)),avgPulse(m.pulse)];});
 var area='<path d="M'+ap[0][0]+","+y(1)+" "+ap.map(function(p){return "L"+p[0]+","+p[1];}).join(" ")+" L"+ap[ap.length-1][0]+","+y(1)+'Z" fill="var(--accent)" opacity=".08"/>';
 lines=area+'<polyline points="'+ap.map(function(p){return p[0]+","+p[1];}).join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.5"/>'+ap.map(function(p,i){var last=i===ap.length-1;return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(last?5:3.5)+'" fill="'+(last?"var(--accent)":"var(--surface)")+'" stroke="var(--accent)" stroke-width="2"/><text x="'+p[0]+'" y="'+(p[1]-10)+'" text-anchor="middle" font-size="11" fill="var(--fg)" font-family="IBM Plex Mono,monospace">'+p[2].toFixed(1)+'</text>';}).join("")+lines;
 var xl=pm.map(function(m,i){var p=m.date.split("-");return '<text x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">'+MON[+p[1]-1]+" "+p[0].slice(2)+'</text>';}).join("");
 var chips='<div class="legend" style="margin-bottom:8px;align-items:center"><span><i style="background:var(--accent)"></i>Meeting pulse average</span>'+(sel?'<span><i style="background:var(--info)"></i>'+IND.filter(function(x){return x[0]===sel;})[0][1]+'</span>':'')+'<select id="ind-pick" data-bind="ind" aria-label="Overlay an indicator" style="max-width:240px;margin-left:auto"><option value="">Overlay an indicator…</option>'+IND.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===sel?" selected":"")+'>'+x[1]+'</option>';}).join("")+'</select></div>';
 return chips+'<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Pulse average across meetings">'+g+lines+xl+'</svg></div>';
}

function insights(ms,fus){
 var hdr='<div class="panel-h"><h2 style="display:flex;align-items:center;gap:8px">AI management insights <span class="pill p-ai">Simulated · rule-based</span></h2><span class="faint" style="font-size:12px">Every point links to the meetings it comes from. Nothing beyond the records.</span></div>';
 if(!ms.length)return '<section class="panel">'+hdr+'<div class="empty">No meetings match these filters, so there is nothing to analyse.</div></section>';
 function scan(themes,secs){return themes.map(function(t){var hits=[],dpt=[];ms.forEach(function(m){secs.forEach(function(s){sentences(m[s]).forEach(function(x){if(has(x,t.kw)){hits.push(m.id);dpt.push(m.team);}});});});return {label:t.label,ids:uniq(hits),teams:uniq(dpt)};}).filter(function(t){return t.ids.length;}).sort(function(a,b){return b.ids.length-a.ids.length;});}

 // early warnings: employees with risk sentences in 2+ meetings, declining pulse, overdue items
 var warn=[];
 var per={};ms.forEach(function(m){if(m.risk||m.neg)m.emps.forEach(function(c){(per[c]=per[c]||[]).push(m.id);});});
 Object.keys(per).forEach(function(c){var ind=per[c].filter(function(id){var m=S.meetings.filter(function(x){return x.id===id;})[0];return m.type==="Individual";});if(ind.length>=2)warn.push('<li><b>'+esc(EBY[c].name)+'</b> raised concerns in '+ind.length+' individual meetings. '+refs(ind)+'</li>');});
 var emps=uniq([].concat.apply([],ms.map(function(m){return m.emps;})));
 var dev=[],decl=[];
 emps.forEach(function(c){var pm=ms.filter(function(m){return m.type==="Individual"&&m.emps[0]===c&&m.pulse;}).sort(function(a,b){return a.date.localeCompare(b.date);});if(pm.length<2)return;
  var av=pm.map(function(m){return avgPulse(m.pulse);}),d=av[av.length-1]-av[0];
  var ld=pm.map(function(m){return m.pulse.l;}).filter(function(v){return typeof v==="number";});
  if(d<=-0.5)decl.push('<li><b>'+esc(EBY[c].name)+'</b> pulse fell from '+av[0].toFixed(1)+' to '+av[av.length-1].toFixed(1)+'. '+refs(pm.map(function(m){return m.id;}))+'</li>');
  if(d>=0.5)dev.push('<li><b>'+esc(EBY[c].name)+'</b> pulse rose from '+av[0].toFixed(1)+' to '+av[av.length-1].toFixed(1)+'. '+refs(pm.map(function(m){return m.id;}))+'</li>');
  if(ld.length>=2&&ld[ld.length-1]>=4&&ld[ld.length-2]>=4)dev.push('<li><b>'+esc(EBY[c].name)+'</b> shows leadership signals of 4+ in consecutive reviews (latest '+ld[ld.length-1]+'). Worth discussing development options, alongside manager input.</li>');});
 var od=fus.filter(overdue);if(od.length)warn.push('<li><b>'+od.length+' follow-up'+(od.length>1?"s are":" is")+' overdue.</b> Oldest: '+esc(od.sort(function(a,b){return a.target.localeCompare(b.target);})[0].item)+' (due '+fd(od[0].target)+'). '+refs(od.map(function(f){return f.meeting;}))+'</li>');
 warn=decl.concat(warn);
 var recs=neg.slice(0,3).map(function(t){return '<li>'+esc(RECS[t.label])+' <span class="faint">Based on '+t.ids.length+' meeting'+(t.ids.length>1?"s":"")+'.</span> '+refs(t.ids)+'</li>';});

  blk("Top recurring issues","c-neg",neg.slice(0,4).map(li),"No recurring issues in this selection.")+

 var sub=team.filter(function(e){var f=latestFb(e.code,m.id);return f&&f.status==="Submitted";}).length;
 var pct=team.length?Math.round(sub/team.length*100):0;
 return '<div class="head"><div><h1>Manager Feedback</h1><p>Signed in as '+esc(m.name)+' · '+esc(m.title)+'. '+esc(CYCLE)+' collection.</p></div></div>'+
 '<div class="stack"><div class="grid3"><div class="kpi"><b>'+team.length+'</b><span>Total employees</span></div><div class="kpi"><b style="color:var(--ok)">'+sub+'</b><span>Submitted</span></div><div class="kpi warn"><b>'+(team.length-sub)+'</b><span>Pending</span></div></div>'+
 '<div class="progress" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100" aria-label="Feedback completed"><i style="width:'+pct+'%"></i></div>'+
 '<section class="panel"><div class="panel-h"><h2>Your team</h2><span class="faint" style="font-size:12px">Only employees assigned to you are shown.</span></div><div class="tbl-wrap"><table><thead><tr><th>Employee</th><th>Code</th><th>Department / Team</th><th>Status</th><th></th></tr></thead><tbody>'+
 team.map(function(e){var f=latestFb(e.code,m.id),st=f?f.status:"Pending";
  return '<tr class="click" data-act="openFb" data-c="'+e.code+'"><td><b style="font-weight:600">'+esc(e.name)+'</b><br><span class="faint" style="font-size:12px">'+esc(e.title)+'</span></td><td class="mono">'+e.code+'</td><td>'+esc(e.dept+" / "+e.team)+'</td><td>'+(st==="Submitted"?'<span class="pill p-ok">Submitted</span> <span class="faint mono" style="font-size:11px">'+fd(f.date)+'</span>':st==="Draft"?'<span class="pill p-info">Draft saved</span>':'<span class="pill p-warn">Pending</span>')+'</td><td style="text-align:right"><button class="btn sm'+(st==="Submitted"?"":" primary")+'" data-act="openFb" data-c="'+e.code+'">'+(st==="Submitted"?"View":st==="Draft"?"Continue":"Give feedback")+'</button></td></tr>';}).join("")+
 '</tbody></table></div></section></div>';
}
function openFb(code){
 var f=latestFb(code,UI.mgr);
 UI.fb={code:code,mode:f&&f.mode==="voice"?"voice":"written",text:f&&f.mode!=="voice"?f.text:"",transcript:f&&f.mode==="voice"?f.text:"",lang:(f&&f.lang)||"Egyptian Arabic",
  audioUrl:null,hasAudio:!!(f&&f.audio),rec:false,secs:0,micErr:"",ai:f?f.ai:null,status:f?f.status:"Pending",existing:f};
 UI.drawer={kind:"fb"};render();
}
function fbForm(){
 var b=UI.fb,e=EBY[b.code],locked=b.status==="Submitted";
 var h='<div class="sec"><div class="sec-t"><div><h3>'+esc(e.name)+' <span class="mono faint">'+e.code+'</span></h3><span class="muted" style="font-size:12.5px">'+esc(e.dept+" · "+e.unit+" · "+e.team)+'</span></div>'+(locked?'<span class="pill p-ok">Submitted '+fd(b.existing.date)+'</span>':'<span class="pill '+(b.status==="Draft"?"p-info":"p-warn")+'">'+(b.status==="Draft"?"Draft":"Pending")+'</span>')+'</div>'+
 (locked?'':'<p class="muted" style="margin:0">Describe this employee in your own words: strengths, what could improve, any concerns. Write or speak, whichever is easier.</p>')+'</div>';
 if(locked){
  h+='<div class="sec"><h3>Your feedback'+(b.existing.mode==="voice"?' · voice note transcript ('+esc(b.existing.lang)+')':'')+'</h3><div class="quote" dir="auto">'+esc(b.existing.text)+'</div>'+(b.existing.audio?'<p class="faint" style="margin:0;font-size:12px">Original audio is stored with the record (sample data has no playable audio).</p>':'')+'</div>'+
   '<div class="sec">'+fbSummary(b.existing.ai,false)+'</div><p class="note">Submitted feedback is stored in the employee\'s history for ER and HR. Contact Fatma in ER if something needs correcting.</p>';
  return h;
 }
 h+='<div class="seg" role="group" aria-label="Feedback type" style="align-self:flex-start">'+[["written","Write"],["voice","Record voice note"]].map(function(x){return '<button data-act="fbMode" data-v="'+x[0]+'" aria-pressed="'+(b.mode===x[0])+'">'+x[1]+'</button>';}).join("")+'</div>';
 if(b.mode==="written"){
  h+='<div class="sec"><label class="field"><span>Written feedback</span><textarea id="fb-text" data-bind="fb.text" rows="9" dir="auto" placeholder="For example: What does this person do well? Where could they grow? Anything that worries you?">'+esc(b.text)+'</textarea></label></div>';
 }else{
  h+='<div class="sec"><div class="rec">'+
   (b.rec?'<button class="rec-btn on" data-act="recStop" aria-label="Stop recording">'+'<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="5" y="5" width="12" height="12" rx="2" fill="currentColor"/></svg></button><div class="timer" id="rec-timer">'+tfmt(b.secs)+'</div><span class="muted">Recording… tap to stop</span>':
    (b.audioUrl||b.hasAudio?'<span class="pill p-ok">Voice note ready</span>'+(b.audioUrl?'<audio controls src="'+b.audioUrl+'"></audio>':'<span class="faint" style="font-size:12px">Saved audio from draft</span>')+'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" data-act="recStart">Re-record</button><button class="btn ai" data-act="transcribe">Transcribe (simulated)</button></div>':
    '<button class="rec-btn" data-act="recStart" aria-label="Start recording"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><span class="muted">Tap to start recording</span>'))+
   '<label class="field" style="width:100%;max-width:260px"><span>Spoken language</span><select id="fb-lang" data-bind="fb.lang"><option'+(b.lang==="Egyptian Arabic"?" selected":"")+'>Egyptian Arabic</option><option'+(b.lang==="English"?" selected":"")+'>English</option></select></label>'+
   (b.micErr?'<p class="note" style="margin:0;text-align:center">'+esc(b.micErr)+'</p><label class="btn sm" style="cursor:pointer">Upload a voice note<input type="file" id="fb-file" accept="audio/*" class="sr" data-bind="fb.file"></label>':'')+
   '</div>'+
   '<label class="field"><span>Transcript · review and correct before submitting</span><textarea id="fb-tx" data-bind="fb.transcript" rows="7" dir="auto" placeholder="The transcript appears here after transcription. You can edit it.">'+esc(b.transcript)+'</textarea></label>'+
   '<p class="faint" style="margin:0;font-size:12px">Transcription is simulated in this prototype. Production will use speech-to-text for Egyptian Arabic and English and keep the original audio.</p></div>';
 }
 h+='<div><button class="btn ai" data-act="fbAI">'+ico('<path d="M8 2l1.4 3.6L13 7l-3.6 1.4L8 12l-1.4-3.6L3 7l3.6-1.4z"/>')+'Organise with AI (simulated)</button></div>';
 if(b.ai)h+='<div class="ai-box"><div class="ai-h">Structured summary <span class="pill p-ai">Simulated · rule-based</span></div>'+FBCATS.map(function(c){return b.ai[c[0]]&&b.ai[c[0]].length?'<div class="ai-item"><div><small class="'+c[2]+'">'+c[1]+'</small><ul style="margin:4px 0 0;padding-left:18px" dir="auto">'+b.ai[c[0]].map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ul></div></div>':'';}).join("")+'<span class="faint" style="font-size:12px">Your sentences, sorted into categories. Nothing is reworded or added. Your original text is stored unchanged.</span></div>';
 return h;
}
function tfmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
var REC={stream:null,mr:null,chunks:[],timer:null};
function recStart(){
 var b=UI.fb;b.micErr="";
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==="undefined"){b.micErr="Recording isn't supported in this browser view. Upload a voice note instead.";renderDrawer();return;}
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
  REC.stream=st;REC.chunks=[];REC.mr=new MediaRecorder(st);
  REC.mr.ondataavailable=function(e){if(e.data.size)REC.chunks.push(e.data);};
  REC.mr.onstop=function(){var blob=new Blob(REC.chunks,{type:REC.mr.mimeType||"audio/webm"});if(b.audioUrl)URL.revokeObjectURL(b.audioUrl);b.audioUrl=URL.createObjectURL(blob);b.hasAudio=true;st.getTracks().forEach(function(t){t.stop();});renderDrawer();};
  REC.mr.start();b.rec=true;b.secs=0;renderDrawer();
  REC.timer=setInterval(function(){b.secs++;var t=document.getElementById("rec-timer");if(t)t.textContent=tfmt(b.secs);},1000);
 }).catch(function(){b.micErr="Microphone access isn't available here. Upload a recorded voice note instead.";renderDrawer();});
}
function recStop(){clearInterval(REC.timer);UI.fb.rec=false;try{REC.mr.stop();}catch(e){renderDrawer();}}
var SAMPLE_TX={
 "Egyptian Arabic":"[نص تجريبي — استبدله بما قيل في التسجيل] الموظف ملتزم جداً وبيخلص شغله في الميعاد. محتاج يتكلم أكتر في الاجتماعات ويشارك أفكاره. أنصح إننا نديله فرصة يقود مشروع صغير الربع الجاي.",
 "English":"[Sample transcript — replace with what was said] Very committed and always delivers on time. Needs to speak up more in meetings and share ideas. I recommend giving them a small project to lead next quarter."
};

/* ---------- Drawer ---------- */
function drawerHTML(){
 var d=UI.drawer;if(!d)return "";
 var title,body,foot;
 if(d.kind==="newMeeting"){title="New meeting record";body=meetingForm();foot='<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="saveMeeting">Save meeting</button>';}
 else if(d.kind==="meeting"){title="Meeting "+d.id;body=meetingDetail(d.id);foot='<button class="btn" data-act="close">Close</button>'+(UI.role!=="mgr"?'<button class="btn" data-act="goEmp" data-id="'+d.id+'">Open employee history</button>':'');}
 else{var b=UI.fb,locked=b.status==="Submitted";title="Employee feedback";body=fbForm();foot=locked?'<button class="btn" data-act="close">Close</button>':'<button class="btn" data-act="close">Cancel</button><button class="btn" data-act="fbDraft">Save draft</button><button class="btn primary" data-act="fbSubmit">Review &amp; submit</button>';}
 return '<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="drawer-h"><h2>'+esc(title)+'</h2><button class="btn sm ghost" data-act="close" aria-label="Close panel">✕</button></div><div class="drawer-b" id="drawer-b">'+body+'</div><div class="drawer-f">'+foot+'</div></aside>';
}
function renderDrawer(){
 var b=document.getElementById("drawer-b");if(!b){render();return;}
 var st=b.scrollTop;var tmp=document.createElement("div");tmp.innerHTML=drawerHTML();
 var old=document.querySelector(".drawer"),nw=tmp.querySelector(".drawer");
 if(old&&nw){old.replaceWith(nw);var nb=document.getElementById("drawer-b");if(nb)nb.scrollTop=st;}
}
function fbSave(status){
 var b=UI.fb,text=(b.mode==="voice"?b.transcript:b.text).trim();
 if(!text){toast(b.mode==="voice"?"Record and transcribe a voice note, or type the transcript, before saving.":"Write some feedback before saving.");return;}
 if(status==="Submitted"&&!UI.confirmSubmit){UI.confirmSubmit=true;if(!b.ai)b.ai=organize(text);renderDrawer();
  var f=document.querySelector(".drawer-f");f.innerHTML='<span class="muted" style="margin-right:auto;align-self:center">Check the summary above, then confirm.</span><button class="btn" data-act="fbCancelConfirm">Back to edit</button><button class="btn primary" data-act="fbSubmit">Confirm submission</button>';return;}
 UI.confirmSubmit=false;
 var ex=b.existing&&b.existing.status==="Draft"?b.existing:null;
 var rec=ex||{id:"FB-"+String(++S.seq.fb).padStart(3,"0"),code:b.code,mgr:UI.mgr,cycle:CYCLE};
 rec.mode=b.mode;rec.text=text;rec.lang=b.mode==="voice"?b.lang:undefined;rec.audio=b.mode==="voice"&&b.hasAudio;rec.date=TODAY;rec.status=status;rec.ai=organize(text);
 if(!ex)S.feedback.push(rec);
 save();UI.drawer=null;UI.fb=null;render();toast(status==="Submitted"?"Feedback submitted for "+EBY[rec.code].name+".":"Draft saved.");
}

/* ---------- Events ---------- */
var VIEW_FN={workspace:vWorkspace,followups:vFollowups,employees:vEmployees,directory:vDirectory,analytics:vAnalytics,feedback:vFeedback};
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-act]");if(!t)return;var a=t.dataset.act;
 if(a==="nav"){UI.view=t.dataset.v;UI.drawer=null;render();window.scrollTo(0,0);}
 else if(a==="reset"){if(t.dataset.confirm){S=seed();save();UI.drawer=null;render();toast("Sample data restored.");}else{t.dataset.confirm="1";t.textContent="Click again to confirm reset";}}
 else if(a==="newMeeting"){UI.mf=blankMeeting();UI.drawer={kind:"newMeeting"};render();}
 else if(a==="openMeeting"){ev.stopPropagation();UI.drawer={kind:"meeting",id:t.dataset.id};UI.closing=null;render();}
 else if(a==="close"){if(UI.fb&&UI.fb.rec)recStop();UI.drawer=null;UI.mf=null;UI.confirmSubmit=false;render();}
 else if(a==="goEmp"){var m=S.meetings.filter(function(x){return x.id===t.dataset.id;})[0];UI.emp=m.emps[0];UI.view="employees";UI.drawer=null;render();window.scrollTo(0,0);}
 else if(a==="mfType"){UI.mf.type=t.dataset.v;if(t.dataset.v==="Individual"&&UI.mf.emps.length>1)UI.mf.emps=UI.mf.emps.slice(0,1);renderDrawer();}
 else if(a==="mfChannel"){UI.mf.channel=t.dataset.v;renderDrawer();}
 else if(a==="mfRemove"){UI.mf.emps=UI.mf.emps.filter(function(c){return c!==t.dataset.c;});renderDrawer();}
 else if(a==="rate"){var k=t.dataset.k,v=t.dataset.v==="NO"?"NO":+t.dataset.v;UI.mf.pulse[k]=UI.mf.pulse[k]===v?null:v;
  t.parentNode.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",String((b.dataset.v==="NO"?"NO":+b.dataset.v)===UI.mf.pulse[k]));});
  document.getElementById("pulse-avg").textContent=f1(avgPulse(UI.mf.pulse));}
 else if(a==="mfAI"){UI.mf.ai=assist(UI.mf);UI.mf.aiSummary=UI.mf.ai.summary;UI.mf.aiDismissed={};renderDrawer();}
 else if(a==="aiAcceptSum"){UI.mf.aiAccepted=true;UI.mf.aiDismissed.sum0="ok";renderDrawer();toast("Summary will be saved with the meeting, marked as AI.");}
 else if(a==="aiDismiss"){UI.mf.aiDismissed[t.dataset.k]="no";if(t.dataset.k==="sum0")UI.mf.aiAccepted=false;renderDrawer();}
 else if(a==="aiAcceptFu"){var f=UI.mf.ai.fus[+t.dataset.i];UI.mf.fus.push({item:f.item,target:f.target});UI.mf.aiDismissed["fu"+t.dataset.i]="ok";renderDrawer();}
 else if(a==="fuAdd"){UI.mf.fus.push({item:"",target:addDays(TODAY,14)});renderDrawer();}
 else if(a==="fuDel"){UI.mf.fus.splice(+t.dataset.i,1);renderDrawer();}
 else if(a==="saveMeeting")saveMeeting();
 else if(a==="fuFilter"){UI.fuFilter=t.dataset.v;render();}
 else if(a==="fuCloseStart"){UI.closing=t.dataset.id;UI.drawer?renderDrawer():render();var i=document.getElementById("close-"+t.dataset.id);if(i)i.focus();}
 else if(a==="fuCloseCancel"){UI.closing=null;UI.drawer?renderDrawer():render();}
 else if(a==="fuClose"){var fu=S.followups.filter(function(x){return x.id===t.dataset.id;})[0],inp=document.getElementById("close-"+fu.id);fu.status="Closed";fu.note=inp?inp.value.trim():"";fu.closed=TODAY;UI.closing=null;save();render();toast(fu.id+" closed.");}
 else if(a==="sync"){toast("Simulated: directory re-read from the sample sheet. "+EMP.length+" employees, no changes.");}
 else if(a==="pickEmp")pickEmp(t.dataset.c);
 else if(a==="efClear"){UI.ef={dept:"",title:"",q:"",has:false};renderFinder();var q=document.getElementById("ef-q");if(q)q.focus();}
 else if(a==="openFb")openFb(t.dataset.c);
 else if(a==="fbMode"){UI.fb.mode=t.dataset.v;UI.fb.ai=null;renderDrawer();}
 else if(a==="recStart")recStart();
 else if(a==="recStop")recStop();
 else if(a==="transcribe"){UI.fb.transcript=SAMPLE_TX[UI.fb.lang];renderDrawer();toast("Simulated transcript inserted. Edit it to match the recording.");}
 else if(a==="fbAI"){var b=UI.fb,txt=b.mode==="voice"?b.transcript:b.text;if(!txt.trim()){toast("Add feedback text first.");return;}b.ai=organize(txt);renderDrawer();}
 else if(a==="fbDraft")fbSave("Draft");
 else if(a==="fbSubmit")fbSave("Submitted");
 else if(a==="fbCancelConfirm"){UI.confirmSubmit=false;renderDrawer();}
});
function bind(el){
 var k=el.dataset.bind,v=el.value;
 if(k==="role"){UI.role=v;UI.drawer=null;render();return;}
 if(k==="mgr"){UI.mgr=v;render();return;}
 if(k==="emp"){UI.emp=v;render();return;}
 if(k==="ef.q"){UI.ef.q=v;var r=finderList();document.getElementById("ef-list").innerHTML=r.html;document.getElementById("ef-count").textContent=r.n+" of "+EMP.length+" employees";
  var fc=document.querySelector(".fd-count");if(fc&&!fc.querySelector(".linkbtn")&&v){fc.insertAdjacentHTML("beforeend",'<button class="linkbtn" data-act="efClear">Clear filters</button>');}return;}
 if(k==="ef.dept"){UI.ef.dept=v;if(jobTitles(v).indexOf(UI.ef.title)<0)UI.ef.title="";renderFinder();return;}
 if(k==="ef.title"){UI.ef.title=v;renderFinder();return;}
 if(k==="ef.has"){UI.ef.has=el.checked;renderFinder();return;}
 if(k==="ind"){UI.ind=v;render();return;}
 if(k==="mtQuery"){UI.mtQuery=v;var pos=el.selectionStart;render();var n=document.getElementById("mt-q");n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}return;}
 if(k.indexOf("af.")===0){var f=k.slice(3);UI.af[f]=v;if(f==="dept"){UI.af.unit="";UI.af.team="";UI.af.emp="";}if(f==="unit"){UI.af.team="";UI.af.emp="";}if(f==="team")UI.af.emp="";render();return;}
 if(k.indexOf("mf.")===0){var p=k.slice(3).split(".");
  if(p[0]==="fus"){UI.mf.fus[+p[1]][p[2]]=v;return;}
  if(p[0]==="add"){if(v){UI.mf.emps.push(v);var e=EBY[v];if(!UI.mf.dept)UI.mf.dept=e.dept;}renderDrawer();return;}
  UI.mf[p[0]]=v;
  if(p[0]==="dept"){UI.mf.unit="";UI.mf.team="";renderDrawer();}
  if(p[0]==="unit"){UI.mf.team="";renderDrawer();}
  if(p[0]==="team")renderDrawer();
  return;}
 if(k.indexOf("fb.")===0){var q=k.slice(3);
  if(q==="file"){var file=el.files&&el.files[0];if(file){if(UI.fb.audioUrl)URL.revokeObjectURL(UI.fb.audioUrl);UI.fb.audioUrl=URL.createObjectURL(file);UI.fb.hasAudio=true;UI.fb.micErr="";renderDrawer();}return;}
  UI.fb[q]=v;return;}
}
function renderFinder(){
 var old=document.querySelector(".finder");if(!old){render();return;}
 var fid=document.activeElement&&document.activeElement.id;
 var tmp=document.createElement("div");tmp.innerHTML=finderHTML();old.replaceWith(tmp.firstChild);
 if(fid){var n=document.getElementById(fid);if(n)n.focus();}
}
function pickEmp(code){
 var l=document.getElementById("ef-list"),st=l?l.scrollTop:0;
 UI.emp=code;render();
 var nl=document.getElementById("ef-list");if(nl)nl.scrollTop=st;
 if(window.matchMedia("(max-width:1000px)").matches){var h=document.querySelector(".eh .stack");if(h)h.scrollIntoView({behavior:"smooth",block:"start"});}
}
document.addEventListener("input",function(ev){var el=ev.target;if(!el.dataset||!el.dataset.bind)return;if(el.tagName==="TEXTAREA"||el.type==="text"||el.type==="search")bind(el);});
document.addEventListener("change",function(ev){var el=ev.target;if(!el.dataset||!el.dataset.bind)return;if(!(el.tagName==="TEXTAREA"||el.type==="text"||el.type==="search"))bind(el);});
document.addEventListener("keydown",function(ev){
 if(ev.key==="Enter"&&ev.target.id==="ef-q"){ev.preventDefault();var first=finderMatches()[0];if(first)pickEmp(first.code);return;}if(ev.key==="Escape"&&UI.drawer){if(UI.fb&&UI.fb.rec)recStop();UI.drawer=null;UI.mf=null;render();}});

render();
})();
</script>
